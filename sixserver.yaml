Name: Fiveserver Configuration File
Version: 1.8

ServerIP: <PUBLIC_IP_OR_VPN_IP>
ListenOn: ""
IpDetectUri: "http://example.invalid/ip"

Lobbies:
    - 'Russia'
    - 'England'
    - 'Italy'
    - 'Spain'
    - 'Germany'
    - 'EuroLeague'
    - name: 'Playground'
      type: ['A']
    - name: 'Training'
      type: noStats
      showMatches: False
    - 'Guest Lobby'

GamePorts:
    pes6: 10881

NetworkServer:
    mainService: 20200
    networkMenuService: 20201
    loginService:
        pes6: 20202
        we2007: 20203

WebInterface:
    port: 8190

Debug:
    false

DB:
    name: sixserver
    user: sixserver
    password: <DB_PASSWORD>
    port: 33066
    readServers: [127.0.0.1]
    writeServers: [127.0.0.1]
    sharePool: True
    ConnectionPool:
        minConnections: 3
        maxConnections: 5
        keepAliveInterval: 60

BannedList: ./etc/data/banned6.yaml

Chat:
    bannedWords: []
    warningMessage: "message was removed because it contains banned words"

Roster:
    enforceHash: false
    compareHash: true

ComputeRanksInterval:
    days: 1
    seconds: 0

StoreSettings: true
ShowStats: true

